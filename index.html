<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#081526" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Kandahar Travel" />
  <title>کندهار افغان سیاحتی شرکت — سیستم جامع مدیریت</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icon.png" />
  <link rel="apple-touch-icon" href="icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --muted: #64748b;
      --border: #cbd5e1;
      --text: #0f172a;
      --primary: #0f4c81;
      --primary-dark: #08243e;
      --accent: #0d9488;
      --success: #16a34a;
      --warning: #d97706;
      --danger: #dc2626;
      --radius: 10px;
      --shadow: 0 2px 8px rgba(15, 23, 42, 0.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Vazirmatn", Tahoma, sans-serif; }
    body { background: var(--bg); color: var(--text); font-size: 13.5px; line-height: 1.6; min-height: 100vh; }

    .lock-screen {
      position: fixed; inset: 0;
      background: linear-gradient(135deg, #071e34 0%, #0f4c81 65%, #0d9488 100%);
      display: none; align-items: center; justify-content: center; padding: 16px; z-index: 200;
    }
    .lock-screen.open { display: flex; }
    .lock-card {
      background: #fff; border-radius: 14px; max-width: 420px; width: 100%;
      padding: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.35); text-align: center;
    }
    .qr-target-banner {
      background: #eff6ff; border: 1px solid #bfdbfe; color: #1e3a8a;
      border-radius: 8px; padding: 8px 10px; font-size: 12px; margin-bottom: 12px;
    }

    .app { display: grid; grid-template-columns: 282px 1fr; min-height: 100vh; }
    .sidebar {
      background: linear-gradient(180deg, #08243e 0%, #0f3d66 100%);
      color: #e2e8f0; padding: 14px 12px; display: flex; flex-direction: column;
      position: sticky; top: 0; height: 100vh; overflow-y: auto; z-index: 60;
    }
    .brand {
      display: flex; align-items: center; gap: 10px;
      padding-bottom: 12px; margin-bottom: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.15);
    }
    .brand-logo {
      width: 46px; height: 46px; border-radius: 10px; object-fit: cover;
      border: 1.5px solid rgba(255,255,255,0.35); background: #fff; flex-shrink: 0;
    }
    .brand-title { font-weight: 700; font-size: 13.5px; color: #fff; }
    .brand-sub { font-size: 11px; color: #bae6fd; }

    .nav-group { font-size: 11px; font-weight: 700; color: #93c5fd; padding: 8px 8px 3px; }
    .nav-btn {
      width: 100%; display: flex; align-items: center; justify-content: space-between;
      gap: 6px; padding: 7.5px 10px; margin-bottom: 2px; border: none; border-radius: 8px;
      background: transparent; color: #e2e8f0; font-size: 12.5px; font-weight: 500;
      text-align: right; cursor: pointer;
    }
    .nav-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
    .nav-btn.active { background: #0284c7; color: #fff; font-weight: 600; }
    .nav-pill { background: rgba(255,255,255,0.2); color: #fff; font-size: 11px; padding: 1px 7px; border-radius: 999px; }

    .user-box {
      margin-top: auto; background: rgba(255,255,255,0.09);
      border-radius: 9px; padding: 10px; font-size: 12px;
    }

    .main { display: flex; flex-direction: column; min-width: 0; }
    .topbar {
      background: var(--card); border-bottom: 1px solid var(--border);
      padding: 10px 14px; display: flex; align-items: center; justify-content: space-between;
      gap: 8px; flex-wrap: wrap; position: sticky; top: 0; z-index: 40;
    }
    .topbar-left, .topbar-right { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .page-title { font-size: 15px; font-weight: 700; color: var(--primary-dark); }
    .save-badge { font-size: 11px; padding: 3px 9px; border-radius: 999px; font-weight: 600; background: #dcfce7; color: #166534; }
    .save-badge.unsaved { background: #fee2e2; color: #991b1b; }

    .content { padding: 14px; max-width: 1540px; width: 100%; margin: 0 auto; }

    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 15px; box-shadow: var(--shadow); margin-bottom: 14px;
    }
    .card-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; flex-wrap: wrap; margin-bottom: 12px;
      padding-bottom: 8px; border-bottom: 1px solid #f1f5f9;
    }
    .card-title { font-size: 14.5px; font-weight: 700; color: var(--primary-dark); }

    .quick-search-bar {
      background: #f8fafc; border: 1.5px solid var(--primary); border-radius: 10px;
      padding: 10px 12px; margin-bottom: 10px;
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    .quick-search-bar input, .quick-search-bar select {
      background: #fff; border-color: var(--primary);
    }
    .quick-search-bar input { flex: 1; min-width: 220px; }

    .sticky-bar {
      background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 10px;
      padding: 10px 12px; margin-bottom: 12px;
    }
    .tick-row {
      display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; font-size: 12px;
    }
    .tick-item {
      display: inline-flex; align-items: center; gap: 5px; cursor: pointer;
      background: #fff; border: 1px solid #cbd5e1; padding: 4px 9px; border-radius: 7px;
    }
    .tick-item input[type="checkbox"] { width: auto; min-height: auto; margin: 0; }

    .doc-upload-bar {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 8px; background: #f0f9ff; border: 1px solid #bae6fd;
      border-radius: 10px; padding: 10px; margin-bottom: 12px;
    }
    .doc-btn-card {
      background: #fff; border: 1px solid #7dd3fc; border-radius: 8px;
      padding: 8px 10px; display: flex; flex-direction: column; gap: 5px;
    }
    .doc-trigger {
      background: var(--primary); color: #fff; border: none; border-radius: 6px;
      padding: 6px 8px; font-size: 12px; font-weight: 700; cursor: pointer; text-align: center;
    }
    .doc-trigger:hover { background: var(--primary-dark); }
    .doc-state { font-size: 11px; color: #0369a1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .family-box {
      background: #fffbeb; border: 1px solid #fde68a; border-radius: 10px;
      padding: 12px; margin: 12px 0;
    }
    .family-member-chip {
      display: inline-flex; align-items: center; gap: 6px;
      background: #fff; border: 1px solid #f59e0b; border-radius: 8px;
      padding: 5px 9px; margin: 4px; font-size: 12px;
    }

    .dup-warn {
      background: #fef2f2; border: 1px solid #fecaca; color: #991b1b;
      padding: 8px 12px; border-radius: 8px; font-size: 12px; margin-bottom: 10px; display: none;
    }

    .lookup-panel {
      background: #f0f9ff; border: 1px solid #bae6fd; border-radius: 10px;
      padding: 14px; margin-top: 10px;
    }

    .drive-banner {
      background: #ecfdf5; border: 1px solid #a7f3d0; border-right: 4px solid var(--success);
      color: #065f46; padding: 10px 14px; border-radius: 8px; margin-bottom: 12px;
      display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    }

    .alert-box {
      background: #fffbeb; border: 1px solid #fcd34d; border-right: 4px solid var(--warning);
      color: #78350f; padding: 10px 14px; border-radius: 8px; margin-bottom: 12px;
      display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    }
    .reject-box {
      background: #fef2f2; border: 1px solid #fecaca; border-right: 4px solid var(--danger);
      color: #7f1d1d; padding: 10px 14px; border-radius: 8px; margin-bottom: 12px;
      display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    }

    .kpis {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 11px; margin-bottom: 14px;
    }
    .kpi {
      background: var(--card); border: 1px solid var(--border);
      border-top: 3px solid var(--primary); border-radius: var(--radius); padding: 12px 14px;
    }
    .kpi.green { border-top-color: var(--success); }
    .kpi.amber { border-top-color: var(--warning); }
    .kpi.red { border-top-color: var(--danger); }
    .kpi-lbl { font-size: 11.5px; color: var(--muted); }
    .kpi-val { font-size: 15.5px; font-weight: 700; margin-top: 3px; }

    .grid-form {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(185px, 1fr));
      gap: 10px; align-items: end;
    }
    .field { display: flex; flex-direction: column; gap: 4px; }
    label { font-size: 12px; font-weight: 600; color: #334155; }
    input, select, textarea {
      width: 100%; padding: 7.5px 10px; border: 1px solid var(--border);
      border-radius: 7px; background: #fff; color: var(--text); font-size: 13px; min-height: 36px;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 5px;
      padding: 7px 12px; border-radius: 7px; border: 1px solid transparent;
      font-size: 12.5px; font-weight: 600; cursor: pointer; text-decoration: none;
      min-height: 35px; white-space: nowrap;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-success { background: var(--success); color: #fff; }
    .btn-teal { background: var(--accent); color: #fff; }
    .btn-gmail { background: #ea4335; color: #fff; }
    .btn-whatsapp { background: #25d366; color: #fff; }
    .btn-warning { background: var(--warning); color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-outline { background: #fff; color: var(--text); border-color: var(--border); }
    .btn-sm { padding: 4px 8px; font-size: 11.5px; min-height: 30px; }

    .avatar { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary); background: #e2e8f0; }
    .avatar-lg { width: 64px; height: 64px; }

    .table-wrap { width: 100%; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    th {
      background: #f8fafc; color: #334155; font-weight: 700;
      padding: 9px; border-bottom: 1px solid var(--border); text-align: right; white-space: nowrap;
    }
    td { padding: 9px; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
    tr:hover td { background: #f8fafc; }

    .badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; white-space: nowrap; }
    .b-arrived { background: #dcfce7; color: #166534; }
    .b-rejected { background: #fee2e2; color: #991b1b; }
    .b-pending { background: #fef3c7; color: #92400e; }
    .b-paid { background: #dcfce7; color: #166534; }
    .b-urgent { background: #ffe4e6; color: #9f1239; }
    .actions { display: flex; flex-wrap: wrap; gap: 4px; }

    .modal-bg {
      position: fixed; inset: 0; background: rgba(15,23,42,0.55);
      display: none; align-items: center; justify-content: center; padding: 14px; z-index: 90;
    }
    .modal-bg.open { display: flex; }
    .modal { background: #fff; border-radius: 12px; max-width: 920px; width: 100%; max-height: 92vh; overflow-y: auto; padding: 18px; }
    .modal-top { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 9px; margin-bottom: 12px; }

    .receipt-box { border: 1.5px dashed #475569; border-radius: 10px; padding: 15px; background: #fcfcfd; }
    .receipt-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; margin: 10px 0; font-size: 13px; }
    .qr-box { display: inline-flex; flex-direction: column; align-items: center; border: 1px solid var(--border); border-radius: 7px; padding: 5px; background: #fff; }

    .app-sheet-card {
      border: 1.5px solid #334155; border-radius: 10px; padding: 16px; background: #fff;
    }
    .app-sheet-header {
      display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
      border-bottom: 2px solid var(--primary-dark); padding-bottom: 10px; margin-bottom: 12px;
    }
    .app-corner-photo {
      width: 92px; height: 108px; object-fit: cover; border-radius: 8px;
      border: 2px solid var(--primary); background: #f1f5f9; flex-shrink: 0;
    }
    .app-info-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; font-size: 13px; margin-bottom: 12px;
    }
    .app-scans-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-top: 12px;
    }
    .app-scan-box {
      border: 1px solid var(--border); border-radius: 8px; padding: 8px; text-align: center; background: #f8fafc;
    }
    .app-scan-box img {
      max-width: 100%; max-height: 250px; object-fit: contain; border-radius: 6px; margin-top: 6px;
    }

    .toast {
      position: fixed; bottom: 16px; left: 16px; background: #0f172a; color: #fff;
      padding: 10px 15px; border-radius: 8px; font-size: 12.5px; opacity: 0;
      transform: translateY(10px); transition: 0.2s; z-index: 120; pointer-events: none;
    }
    .toast.show { opacity: 1; transform: translateY(0); }

    .menu-btn { display: none; }
    .overlay { display: none; position: fixed; inset: 0; background: rgba(15,23,42,0.45); z-index: 50; }
    .overlay.open { display: block; }

    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { position: fixed; right: -285px; top: 0; bottom: 0; width: 282px; transition: right 0.2s ease; }
      .sidebar.open { right: 0; }
      .menu-btn { display: inline-flex; }
      .content { padding: 10px; }
      .receipt-grid, .app-info-grid { grid-template-columns: 1fr; }
    }
    @media print {
      body * { visibility: hidden; }
      #printArea, #printArea * { visibility: visible; }
      #printArea { position: fixed; inset: 0; background: #fff; padding: 14px; overflow: visible; }
    }
  </style>
</head>
<body>
  <div class="lock-screen" id="lockScreen">
    <div class="lock-card">
      <img id="lockLogo" src="icon.png" onerror="this.src=fallbackLogo()" style="width:72px;height:72px;border-radius:14px;object-fit:cover;margin-bottom:10px;border:2px solid var(--primary);" alt="لوگو" />
      <h2 style="font-size:17px;color:var(--primary-dark);" id="lockCompany">کندهار افغان سیاحتی شرکت</h2>
      <p style="font-size:12px;color:var(--muted);margin:5px 0 10px;">کد اختصاصی کارمند خود را برای ورود وارد کنید</p>
      <div class="qr-target-banner" id="qrTargetBanner" style="display:none;"></div>
      <div class="field" style="text-align:right;margin-bottom:12px;">
        <label>کد اختصاصی کارمند</label>
        <input type="password" id="appPassInput" placeholder="کد اختصاصی خود را وارد کنید..." onkeydown="if(event.key==='Enter') unlockApp()" />
      </div>
      <button class="btn btn-primary" style="width:100%;" onclick="unlockApp()">🔐 ورود به سیستم شرکت</button>
    </div>
  </div>

  <div class="overlay" id="overlay" onclick="closeMenu()"></div>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <img class="brand-logo" id="sidebarLogo" src="icon.png" onerror="this.src=fallbackLogo()" alt="لوگو" />
        <div>
          <div class="brand-title" id="sidebarCompanyName">کندهار افغان سیاحتی شرکت</div>
          <div class="brand-sub">سیستم جامع ویزا، تکت، صرافی و اکسل</div>
        </div>
      </div>

      <div class="nav-group">بخش‌های عملیاتی</div>
      <button class="nav-btn" data-tab="lookup" onclick="goTab('lookup')">
        <span>🔎 جستجوی سریع مشتریان</span><span class="nav-pill" id="pillLookup">0</span>
      </button>
      <button class="nav-btn active" data-tab="visas" onclick="goTab('visas')">
        <span>⚡ ثبت سریع مشتری و ویزا</span><span class="nav-pill" id="pillVisas">0</span>
      </button>
      <button class="nav-btn" data-tab="urgent" onclick="goTab('urgent')">
        <span>🚨 ویزاهای عاجل</span><span class="nav-pill" id="pillUrgent">0</span>
      </button>
      <button class="nav-btn" data-tab="dashboard" onclick="goTab('dashboard')">
        <span>📊 داشبورد و وضعیت ویزا</span><span class="nav-pill" id="pillAlerts">0</span>
      </button>
      <button class="nav-btn" data-tab="tickets" onclick="goTab('tickets')">
        <span>✈️ صدور تکت هواپیما</span><span class="nav-pill" id="pillTickets">0</span>
      </button>
      <button class="nav-btn" data-tab="excel" onclick="goTab('excel')">
        <span>📗 فایل اکسل متصل</span><span class="nav-pill" id="pillExcel">0</span>
      </button>
      <button class="nav-btn" data-tab="companies" onclick="goTab('companies')">
        <span>🏢 شرکت‌های ترانزیتی و سیاحتی</span><span class="nav-pill" id="pillComp">0</span>
      </button>
      <button class="nav-btn" data-tab="debtors" onclick="goTab('debtors')">
        <span>💳 مقروضین دیگر (۴ اسعار)</span><span class="nav-pill" id="pillDebt">0</span>
      </button>
      <button class="nav-btn" data-tab="passports" onclick="goTab('passports')">
        <span>🗄️ بایگانی و تحویل پاسپورت</span><span class="nav-pill" id="pillPass">0</span>
      </button>
      <button class="nav-btn" data-tab="customers" onclick="goTab('customers')">
        <span>🧾 قبض QR و پیام واتساپ</span><span class="nav-pill" id="pillCust">0</span>
      </button>

      <div class="nav-group">مدیریت و تنظیمات</div>
      <button class="nav-btn" data-tab="staff" onclick="goTab('staff')">
        <span>👥 کارمندان و کدهای اختصاصی</span><span class="nav-pill" id="pillStaff">0</span>
      </button>
      <button class="nav-btn" data-tab="exchange" onclick="goTab('exchange')">
        <span>💱 نرخ اسعار و معادل سرمایه</span>
      </button>
      <button class="nav-btn" data-tab="gmails" onclick="goTab('gmails')">
        <span>📧 جیمیل‌های ثبت ویزا</span><span class="nav-pill" id="pillGmail">0</span>
      </button>
      <button class="nav-btn" data-tab="docs" onclick="goTab('docs')">
        <span>📁 اسناد، درایو E و پوشه شخصی</span><span class="nav-pill" id="pillDocs">0</span>
      </button>
      <button class="nav-btn" data-tab="audit" onclick="goTab('audit')">
        <span>🕵️ تاریخچه ثبت و فعالیت‌ها</span><span class="nav-pill" id="pillAudit">0</span>
      </button>
      <button class="nav-btn" data-tab="office" onclick="goTab('office')">
        <span>🔐 لوگو، جیمیل روزانه، سرور و رمزها</span>
      </button>

      <div class="nav-group">بخش‌های مالی (با رمز جداگانه)</div>
      <button class="nav-btn" data-tab="expenses" onclick="goTab('expenses')">
        <span>🔒 💸 هزینه‌های دفتر</span>
      </button>
      <button class="nav-btn" data-tab="reports" onclick="goTab('reports')">
        <span>🔒 📈 گزارش مالی جامع</span>
      </button>

      <div class="user-box">
        <div style="display:flex;align-items:center;gap:8px;">
          <img id="sidebarApplicantThumb" class="avatar" src="" style="display:none;" alt="متقاضی" />
          <div>
            <div><strong>ثبت‌کننده:</strong> <span id="curUserName" style="color:#fff;">حاجی محمد اسماعیل رفیقی</span></div>
            <div id="curUserRole" style="font-size:11px;color:#93c5fd;">رئیس شرکت</div>
          </div>
        </div>
        <div id="curUserWorkState" style="font-size:11px;color:#86efac;margin-top:4px;">وضعیت کار: فعال</div>
        <button class="btn btn-outline btn-sm" style="width:100%;margin-top:7px;" onclick="lockApp()">🔒 قفل / تغییر کد کارمند</button>
      </div>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="btn btn-outline btn-sm menu-btn" onclick="openMenu()">☰ منو</button>
          <span class="page-title" id="pageTitle">ثبت سریع مشتری و ویزا</span>
          <span class="save-badge" id="saveBadge">✓ ذخیره شد</span>
        </div>
        <div class="topbar-right">
          <button class="btn btn-teal btn-sm" onclick="connectEDriveFolder()">💾 اتصال پوشه درایو E</button>
          <button class="btn btn-success btn-sm" onclick="connectLiveExcelFile()">📗 اتصال اکسل زنده</button>

    }

    function toShamsi(iso) {
      if (!iso || !iso.includes("-")) return "";
      const [gy, gm, gd] = iso.split("-").map(Number);
      if (!gy || !gm || !gd) return "";
      const g_d_m = [0,31,59,90,120,151,181,212,243,273,304,334];
      const gy2 = gm > 2 ? gy + 1 : gy;
      let days = 355666 + 365 * gy + Math.floor((gy2+3)/4) - Math.floor((gy2+99)/100) + Math.floor((gy2+399)/400) + gd + g_d_m[gm-1];
      let jy = -1595 + 33 * Math.floor(days / 12053);
      days %= 12053;
      jy += 4 * Math.floor(days / 1461);
      days %= 1461;
      if (days > 365) { jy += Math.floor((days-1)/365); days = (days-1)%365; }
      const jm = days < 186 ? 1 + Math.floor(days/31) : 7 + Math.floor((days-186)/30);
      const jd = 1 + (days < 186 ? days%31 : (days-186)%30);
      return `${jy}/${String(jm).padStart(2,"0")}/${String(jd).padStart(2,"0")}`;
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(DB_KEY) || localStorage.getItem("KANDAHAR_AFGHAN_TRAVEL_UNIFIED_V19") || localStorage.getItem("KANDAHAR_AFGHAN_TRAVEL_UNIFIED_V18");
        if (raw) {
          const parsed = JSON.parse(raw);
          const base = emptyData();
          const merged = Object.assign(base, parsed, {
            office: Object.assign(base.office, parsed.office || {}),
            ratesToUSD: Object.assign(base.ratesToUSD, parsed.ratesToUSD || {})

            merged.team = merged.team.map((emp, idx) => ({

              code: emp.code || emp.password || String(101 + idx)

          }

        }
      } catch (e) {}

    function saveToIDB(obj) {
      try {
        const req = indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = e => { if (!e.target.result.objectStoreNames.contains(IDB_STORE)) e.target.result.createObjectStore(IDB_STORE); };
        req.onsuccess = e => {
          const tx = e.target.result.transaction(IDB_STORE, "readwrite");
          tx.objectStore(IDB_STORE).put(JSON.stringify(obj), "latest");
        };
      } catch (e) {}
    }

    async function syncToServerIfConfigured(silent = true) {
      const url = (state.serverSyncUrl || "").trim();
      if (!url) return;
      try {
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            company: state.office.name,
            updatedAt: new Date().toISOString(),
            visas: state.visas,
            tickets: state.tickets,
            passports: state.passports,
            auditLogs: state.auditLogs.slice(0, 50)
          })
        });
        if (!silent && res.ok) notify("اطلاعات در سرور نیز همگام‌سازی شد.");
      } catch (_) {
        if (!silent) notify("همگام‌سازی مستقیم سرور انجام نشد؛ آدرس سرور را بررسی کنید.", true);
      }

      return confirm("⚠️ کارها هنوز ذخیره نشده‌اند! آیا مطمئن هستید بدون ذخیره خارج شوید؟");

        e.returnValue = "";

    function notify(msg, err = false) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.style.background = err ? "#991b1b" : "#0f172a";
      t.classList.add("show");
      clearTimeout(window._tt);
      window._tt = setTimeout(() => t.classList.remove("show"), 3600);
    }

      const u = me();
      return Boolean(u && (u.isAdmin || /رئیس|معاون/i.test(u.job || "")));
    }
    function canOperate() {
      const u = me();
      return Boolean(u && u.active !== false);
    }

    function addAudit(txt) {
      const d = new Date();
      const ts = `${todayISO()} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
      const u = me();
      state.auditLogs.unshift({ time: ts, user: `${u.name} (${u.job})`, action: txt });
      if (state.auditLogs.length > 250) state.auditLogs.length = 250;
    }

          state.unlocked = false;
          addAudit(`اسکن QR رسید با شناسه ${caseId}`);
          saveState();

      if (!pendingQrCaseId) return;

      if (emp) {

        state.unlocked = true;
        document.getElementById("appPassInput").value = "";

    function compressDataUrl(dataUrl, cb) {
      const img = new Image();
      img.onload = () => {
        const c = document.createElement("canvas");
        let w = img.width, h = img.height, max = 560;
        if (w > h && w > max) { h = h * max / w; w = max; }
        else if (h >= w && h > max) { w = w * max / h; h = max; }
        c.width = w; c.height = h;
        c.getContext("2d").drawImage(img, 0, 0, w, h);
        cb(c.toDataURL("image/jpeg", 0.85));
      };
      img.src = dataUrl;
    }

    function pickLogoImage(ev) {
      if (!checkWorkAllowed()) return;
      const f = ev.target.files[0]; if (!f) return;

          state.office.logo = url;
          saveState();
          notify("لوگو ذخیره شد.");

    }

    function currentFolderNameFromForm() {
      const custom = document.getElementById("vCustomFolder")?.value.trim();
      if (custom) return custom.replace(/[^\w\u0600-\u06FF_-]+/g, "_");
      const fn = document.getElementById("vFirstName")?.value.trim() || "";
      const ln = document.getElementById("vLastName")?.value.trim() || "";
      const base = `${fn} ${ln}`.trim() || "مشتری";
      return base.replace(/[^\w\u0600-\u06FF_-]+/g, "_");
    }

    function personFolderName(v) {
      if (v && v.customFolder && v.customFolder.trim()) {
        return v.customFolder.trim().replace(/[^\w\u0600-\u06FF_-]+/g, "_");
      }
      const base = `${v?.firstName || ""} ${v?.lastName || ""}`.trim() || "مشتری";
      return base.replace(/[^\w\u0600-\u06FF_-]+/g, "_");
    }

    function dataUrlToBlob(dataUrl) {
      const parts = dataUrl.split(",");
      const mime = (parts[0].match(/:(.*?);/) || [])[1] || "image/jpeg";
      const bin = atob(parts[1] || "");
      const arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      return new Blob([arr], { type: mime });
    }

    async function writeFileIntoPersonalFolder(folderName, fileName, contentOrDataUrl, isDataUrl = false) {
      if (!eDriveRootHandle) return false;
      try {
        const subDir = await eDriveRootHandle.getDirectoryHandle(folderName, { create: true });
        const fh = await subDir.getFileHandle(fileName, { create: true });
        const wr = await fh.createWritable();
        await wr.write(isDataUrl ? dataUrlToBlob(contentOrDataUrl) : contentOrDataUrl);
        await wr.close();
        return true;
      } catch (e) {
        return false;
      }
    }

      if (!checkWorkAllowed()) return;
      const f = ev.target.files[0]; if (!f) return;
      const folderName = currentFolderNameFromForm();
      const r = new FileReader();
      r.onload = async e => {
        const rawUrl = e.target.result;
        const done = async (finalUrl) => {
          markUnsaved();
          if (kind === "passport") {
            document.getElementById("vPassportDoc").value = finalUrl;
            document.getElementById("stPassport").textContent = `✓ ${f.name}`;
            await writeFileIntoPersonalFolder(folderName, `${folderName}_پاسپورت.jpg`, finalUrl, true);
          } else if (kind === "tazkira") {
            document.getElementById("vTazkira").value = finalUrl;
            document.getElementById("stTazkira").textContent = `✓ ${f.name}`;
            await writeFileIntoPersonalFolder(folderName, `${folderName}_تذکره.jpg`, finalUrl, true);
          } else if (kind === "photo") {

            document.getElementById("stPhoto").textContent = `✓ ${f.name}`;
            await writeFileIntoPersonalFolder(folderName, `${folderName}_عکس.jpg`, finalUrl, true);

            document.getElementById("stUrgentDoc").textContent = `✓ ${f.name}`;

        };

      };
      r.readAsDataURL(f);

        return;

        const folderName = currentFolderNameFromForm();

    }

    function generateQrSvg(caseId) {
      const s = `${window.location.origin}${window.location.pathname}#qr=${encodeURIComponent(caseId)}`;
      let h = 2166136261;
      for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
      let cells = "";
      for (let r = 0; r < 15; r++) {
        for (let c = 0; c < 15; c++) {
          const f = (r < 4 && c < 4) || (r < 4 && c >= 11) || (r >= 11 && c < 4);
          const bit = f ? ((r===0||r===3||c===0||c===3||r===14||r===11||c===14||c===11||(r===1&&c===1)||(r===2&&c===2))?1:0)
                        : (((h >> ((r*7+c*13)%31)) ^ (r*3+c*5+s.length)) & 1);
          if (bit) cells += `<rect x="${c*5}" y="${r*5}" width="5" height="5" fill="#0f172a"/>`;
        }
      }
      return `<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 75 75">${cells}</svg>`;
    }

    function matchesExactCustomerQuery(v, rawQ, mode = "all") {
      const q = (rawQ || "").trim().toLowerCase();
      if (!q) return true;
      const fullName = `${v.firstName || ""} ${v.lastName || ""}`.trim().toLowerCase();
      const passNum = (v.passport || "").trim().toLowerCase();
      const phoneClean = cleanNum(rawQ);
      const vPhoneClean = cleanNum(v.phone || "");

      if (mode === "name") return fullName === q;
      if (mode === "passport") return passNum !== "" && passNum === q;
      if (mode === "phone") return phoneClean !== "" && vPhoneClean === phoneClean;

      return (
        fullName === q ||
        (passNum !== "" && passNum === q) ||
        (phoneClean !== "" && vPhoneClean === phoneClean)
      );
    }

                  <button class="btn btn-danger btn-sm" onclick="delVisa('${v.id}')">حذف</button>
                </div></td>

            }).join("") : `<tr><td colspan="8" style="text-align:center;color:var(--muted);padding:18px;">موردی ثبت یا یافت نشد.</td></tr>`}
          </tbody></table></div>
        </div>
      `;
    }

    function saveVisa(e) {
      e.preventDefault();
      if (!checkWorkAllowed()) return;
      const id = document.getElementById("vId").value;
      const firstName = document.getElementById("vFirstName").value.trim();
      const lastName = document.getElementById("vLastName").value.trim();
      const address = document.getElementById("vAddress").value.trim();
      const customFolder = document.getElementById("vCustomFolder").value.trim();
      const familyMembers = draftFamilyMembers.map(m => ({ ...m }));
      const companions = familyMembers.map(m => `${m.firstName} ${m.lastName}`.trim()).filter(Boolean).join("، ");
      const passportNum = document.getElementById("vPassport").value.trim();
      const totalPassports = calcTotalPassports(passportNum, familyMembers);
      const gmail = document.getElementById("vGmail").value.trim();
      const country = document.getElementById("vCountry").value;
      const passportType = document.getElementById("vPassportType").value;
      const gDate = document.getElementById("vDate").value;
      const sDate = document.getElementById("vShamsiDate").value.trim() || toShamsi(gDate);
      const companyRegNo = document.getElementById("vCompanyRegNo").value.trim() || nextCompanyRegNo();
      const section = document.getElementById("vSection").value.trim();
      const dossier = document.getElementById("vDossier").value.trim();
      const shelf = document.getElementById("vShelf").value.trim();
      const status = document.getElementById("vStatus").value;
      const currency = document.getElementById("vCurrency").value || "AFN";
      const total = parseFloat(document.getElementById("vTotal").value || 0);
      const paid = parseFloat(document.getElementById("vPaid").value || 0);
      const passportDoc = document.getElementById("vPassportDoc").value;
      const tazkira = document.getElementById("vTazkira").value;
      const photo = document.getElementById("vPhoto").value;
      const urgentDoc = document.getElementById("vUrgentDoc").value;
      const actor = me();

      if (!id && companyRegNo === `KTA-REG-${String(Number(state.regCounter || 1)).padStart(4, "0")}`) {
        nextCompanyRegNo();
      }

      if (stickyDefaults.tickCountry) stickyDefaults.country = country;
      if (stickyDefaults.tickType) stickyDefaults.passportType = passportType;
      if (stickyDefaults.tickMoney) { stickyDefaults.currency = currency; stickyDefaults.total = total; stickyDefaults.paid = paid; }
      if (stickyDefaults.tickArchive) { stickyDefaults.section = section; stickyDefaults.dossier = dossier; stickyDefaults.shelf = shelf; }
      if (stickyDefaults.tickGmail) stickyDefaults.gmail = gmail;

      if (gmail && !state.gmails.some(g => g.email.toLowerCase() === gmail.toLowerCase())) {
        state.gmails.unshift({ id: "G-" + Date.now(), email: gmail, country, lastFeed: `مشتری: ${firstName} ${lastName} (توسط ${actor.name})` });
      }

      const existing = id ? state.visas.find(x => x.id === id) : null;
      const rec = {
        id: id || ("V-" + Date.now()),
        applicantMode: familyMembers.length > 0 ? "family" : "individual",
        familyMembers, totalPassports,
        firstName, lastName, address, customFolder, companions,
        fatherName: document.getElementById("vFatherName").value.trim(),
        spouseName: document.getElementById("vSpouseName").value.trim(),
        passportType,
        persons: parseInt(document.getElementById("vPersons").value || 1, 10) || 1,
        passport: passportNum,
        companyRegNo,
        visaReference: document.getElementById("vRefNum").value.trim(),
        phone: cleanNum(document.getElementById("vPhone").value),
        country, gmail, section, dossier, shelf,
        status,
        date: gDate, shamsiDate: sDate,
        currency, total, paid,
        passportDoc, tazkira, photo, urgentDoc,
        notes: document.getElementById("vNotes").value.trim(),
        createdBy: existing ? (existing.createdBy || actor.name) : actor.name,
        updatedBy: actor.name
      };

      if (id) {
        const idx = state.visas.findIndex(x => x.id === id);
        if (idx !== -1) state.visas[idx] = rec;
        addAudit(`ویرایش پرونده ${firstName} ${lastName} (${companyRegNo})`);
      } else {
        state.visas.push(rec);
        addAudit(`ثبت مشتری: ${firstName} ${lastName} (${totalPassports} پاسپورت)`);
      }

      const existingPass = state.passports.find(p => p.caseId === rec.id || (passportNum && p.number === passportNum));
      const passObj = {
        id: existingPass ? existingPass.id : ("P-" + Date.now()),
        caseId: rec.id,
        owner: `${firstName} ${lastName}`,
        number: passportNum,
        regNo: companyRegNo,
        phone: rec.phone,
        section: section || "آرشیو ویزا",
        dossier: dossier || "—",
        shelf: shelf || "—",
        inDate: gDate,
        shamsiDate: sDate,
        state: status === "Delivered" ? "Returned" : "Held",
        createdBy: rec.createdBy
      };
      if (existingPass) Object.assign(existingPass, passObj);
      else state.passports.push(passObj);

      const folderLabel = personFolderName(rec);
      if (passportDoc && !state.docs.some(d => d.caseId === rec.id && d.kind === "passport")) {
        state.docs.unshift({ id: "DOC-P-" + Date.now(), caseId: rec.id, kind: "passport", title: `پاسپورت ${firstName} ${lastName}`, name: `${folderLabel}_پاسپورت.jpg`, data: passportDoc, date: gDate, createdBy: actor.name });
      }
      if (photo && !state.docs.some(d => d.caseId === rec.id && d.kind === "photo")) {
        state.docs.unshift({ id: "DOC-PH-" + Date.now(), caseId: rec.id, kind: "photo", title: `عکس ${firstName} ${lastName}`, name: `${folderLabel}_عکس.jpg`, data: photo, date: gDate, createdBy: actor.name });
      }
      if (tazkira && !state.docs.some(d => d.caseId === rec.id && d.kind === "tazkira")) {
        state.docs.unshift({ id: "DOC-T-" + Date.now(), caseId: rec.id, kind: "tazkira", title: `تذکره ${firstName} ${lastName}`, name: `${folderLabel}_تذکره.jpg`, data: tazkira, date: gDate, createdBy: actor.name });
      }
      if (urgentDoc && !state.docs.some(d => d.caseId === rec.id && d.kind === "urgentDoc")) {
        state.docs.unshift({ id: "DOC-U-" + Date.now(), caseId: rec.id, kind: "urgentDoc", title: `سند ضروری ${firstName} ${lastName}`, name: `${folderLabel}_سند_ضروری.jpg`, data: urgentDoc, date: gDate, createdBy: actor.name });
      }

      saveState();
      if (eDriveRootHandle) savePersonFilesToEDriveAndDownload(rec.id);
      resetVisaForm(); render();
      printApplicationSheet(rec.id);
      notify(`ثبت شد؛ برگه پرنت آماده است.`);
    }

      const f = document.getElementById("vForm"); if (!f) return;

      renderFamilyDraftList();

    function delVisa(id) {
      if (!checkWorkAllowed()) return;
      if (!confirm("این مشتری حذف شود؟")) return;
      state.visas = state.visas.filter(x => x.id !== id);
      state.passports = state.passports.filter(p => p.caseId !== id);
      addAudit("حذف یک پرونده مشتری");
      saveState(); render(); notify("حذف شد.");
    }

    function staffView() {
      const adminOk = isAdminUser();
      const statsRows = state.team.map(emp => {
        const vCount = state.visas.filter(x => x.createdBy === emp.name).length;
        const tCount = state.tickets.filter(x => x.createdBy === emp.name).length;
        const uCount = state.urgentVisas.filter(x => x.createdBy === emp.name).length;
        return `<tr>
          <td><strong>${esc(emp.name)}</strong></td>
          <td>${esc(emp.job)}</td>
          <td><span class="badge ${emp.active !== false ? "b-arrived" : "b-rejected"}">${emp.active !== false ? "✅ فعال" : "⛔ متوقف"}</span></td>
          <td>${adminOk ? `<strong>${esc(emp.code || "—")}</strong>` : "•••"}</td>
          <td>ویزا: <strong>${vCount}</strong> | تکت: <strong>${tCount}</strong> | عاجل: <strong>${uCount}</strong></td>
          <td>${adminOk ? `<div class="actions">

      return `
        <div class="card">
          <div class="card-head">
            <h3 class="card-title">👥 مدیریت کارمندان، کدهای اختصاصی و تفکیک عملکرد</h3>
            <span class="badge ${adminOk ? "b-arrived" : "b-pending"}">${adminOk ? "دسترسی کامل مدیریت (رئیس/معاون)" : "مشاهده لیست"}</span>
          </div>
          ${adminOk ? `
            <form class="grid-form" onsubmit="addEmployee(event)">
              <div class="field"><label>نام کامل کارمند *</label><input name="name" required /></div>

          ` : `<div class="alert-box"><div>تنها رئیس یا معاون می‌تواند کارمند اضافه/حذف کند، کد اختصاصی تعیین کند یا کار کارمند را متوقف/فعال سازد.</div></div>`}

        <div class="card">

          </tr></thead><tbody>${statsRows}</tbody></table></div>

      `;

    function addEmployee(e) {
      e.preventDefault();
      if (!isAdminUser()) return notify("فقط رئیس یا معاون مجاز است.", true);
      const fd = new FormData(e.target);
      const name = fd.get("name").trim();
      const job = fd.get("job").trim();
      const code = fd.get("code").trim();
      const active = fd.get("active") === "true";
      if (state.team.some(x => String(x.code || "").trim() === code)) {
        return notify("این کد اختصاصی قبلاً برای کارمند دیگری ثبت شده است!", true);
      }
      state.team.push({ id: "U-" + Date.now(), name, job, code, active, isAdmin: false });
      addAudit(`افزودن کارمند جدید: ${name} (${job})`);
      saveState(); render(); notify("کارمند با کد اختصاصی اضافه شد.");
    }

    function toggleEmployeeWork(id) {
      if (!isAdminUser()) return notify("فقط رئیس یا معاون مجاز است.", true);
      const emp = state.team.find(x => x.id === id); if (!emp) return;
      emp.active = emp.active === false ? true : false;
      addAudit(`${emp.active ? "فعال‌سازی" : "توقف"} کار کارمند: ${emp.name}`);
      saveState(); render();
      notify(`وضعیت کار ${emp.name} به «${emp.active ? "فعال" : "متوقف"}» تغییر کرد.`);
    }

    function changeEmployeeCode(id) {
      if (!isAdminUser()) return notify("فقط رئیس یا معاون مجاز است.", true);
      const emp = state.team.find(x => x.id === id); if (!emp) return;
      const nc = prompt(`کد اختصاصی جدید برای «${emp.name}» وارد کنید:`, emp.code || "");
      if (!nc || !nc.trim()) return;
      const cleanCode = nc.trim();
      if (state.team.some(x => x.id !== id && String(x.code || "").trim() === cleanCode)) {
        return notify("این کد قبلاً استفاده شده است!", true);
      }
      emp.code = cleanCode;
      addAudit(`تغییر کد اختصاصی کارمند: ${emp.name}`);
      saveState(); render(); notify("کد اختصاصی کارمند تغییر یافت.");
    }

    function removeEmployee(id) {
      if (!isAdminUser()) return notify("فقط رئیس یا معاون مجاز است.", true);
      const emp = state.team.find(x => x.id === id); if (!emp) return;
      if (emp.isAdmin) return notify("حذف حساب رئیس/معاون مجاز نیست.", true);
      if (!confirm(`کارمند «${emp.name}» حذف شود؟`)) return;
      state.team = state.team.filter(x => x.id !== id);
      if (state.userId === id) state.userId = state.team[0]?.id || "U-1";
      addAudit(`حذف کارمند: ${emp.name}`);
      saveState(); render(); notify("کارمند حذف شد.");
    }

              <td><div class="actions">
                ${u.status!=="Arrived"?`<button class="btn btn-success btn-sm" onclick="if(!checkWorkAllowed())return;const x=state.urgentVisas.find(i=>i.id==='${u.id}');if(x){x.status='Arrived';saveState();render();}">تایید صدور</button>`:""}
                <button class="btn btn-danger btn-sm" onclick="if(!checkWorkAllowed())return;state.urgentVisas=state.urgentVisas.filter(i=>i.id!=='${u.id}');saveState();render()">حذف</button>
              </div></td>
            </tr>`).join("") : `<tr><td colspan="7" style="text-align:center;color:var(--muted);">ویزای عاجلی ثبت نشده است.</td></tr>`}
          </tbody></table></div>

    function addUrgentVisa(e) {
      e.preventDefault();
      if (!checkWorkAllowed()) return;
      const fd = new FormData(e.target);
      const actor = me().name;
      state.urgentVisas.unshift({
        id: "UV-" + Date.now(),
        name: fd.get("name").trim(),
        passport: fd.get("passport").trim(),
        country: fd.get("country").trim(),
        date: fd.get("date") || todayISO(),
        status: fd.get("status"),
        notes: fd.get("notes").trim(),
        createdBy: actor
      });
      addAudit(`ثبت ویزای عاجل برای ${fd.get("name")}`);
      saveState(); render(); notify("ویزای عاجل ثبت شد.");
    }

    function downloadDailyArchiveBundle() {
      const td = todayISO();
      const sh = toShamsi(td);
      const todayRows = state.visas.filter(v => v.date === td);
      const targetList = todayRows.length ? todayRows : state.visas;

          <div class="card-head"><h3 class="card-title">قبض QR و پیام واتساپ مشتریان</h3></div>
          <div class="table-wrap"><table><thead><tr><th>مشتری</th><th>شماره ثبت شرکت</th><th>کل پاسپورت‌ها</th><th>وضعیت ویزا</th><th>عملیات</th></tr></thead><tbody>
            ${state.visas.length ? state.visas.map(v => `<tr>
              <td><strong>${esc(v.firstName)} ${esc(v.lastName)}</strong></td>
              <td><strong>${esc(v.companyRegNo || "—")}</strong></td>
              <td>${v.totalPassports || calcTotalPassports(v.passport, v.familyMembers)}</td>
              <td>${esc(statusLabel(v.status))}</td>
              <td><div class="actions">
                <button class="btn btn-primary btn-sm" onclick="printApplicationSheet('${v.id}')">🖨 پرنت مشخصات</button>
                ${v.phone ? `<a class="btn btn-whatsapp btn-sm" target="_blank" rel="noopener" href="${waLink(v.phone, buildWaMessage(v))}">واتساپ</a>` : ""}
                <button class="btn btn-success btn-sm" onclick="printReceipt('${v.id}')">قبض</button>
              </div></td>
            </tr>`).join("") : `<tr><td colspan="5" style="text-align:center;color:var(--muted);">مشتری نیست.</td></tr>`}
          </tbody></table></div>
        </div>
      `;
    }

    function exchangeView() {
      const r = state.ratesToUSD || { USD: 1, AFN: 70.5, EUR: 0.92, PKR: 278.5 };
      return `
        <div class="card">
          <div class="card-head"><h3 class="card-title">💱 تنظیم نرخ روز اسعار نسبت به ۱ دالر (USD)</h3></div>
          <form class="grid-form" onsubmit="e=>{e.preventDefault();}">
            <div class="field"><label>۱ دالر ($) چند افغانی است؟</label><input type="number" id="rAFN" step="0.01" value="${r.AFN}" /></div>
            <div class="field"><label>۱ دالر ($) چند یورو است؟</label><input type="number" id="rEUR" step="0.0001" value="${r.EUR}" /></div>
            <div class="field"><label>۱ دالر ($) چند کلدار است؟</label><input type="number" id="rPKR" step="0.01" value="${r.PKR}" /></div>
            <div class="field"><button type="button" class="btn btn-primary" onclick="if(!checkWorkAllowed())return;state.ratesToUSD={USD:1,AFN:+document.getElementById('rAFN').value||70.5,EUR:+document.getElementById('rEUR').value||0.92,PKR:+document.getElementById('rPKR').value||278.5};saveState();notify('نرخ اسعار ذخیره شد.');">ذخیره نرخ‌ها</button></div>
          </form>
        </div>
      `;
    }

    function gmailView() {
      return `
        <div class="card">
          <div class="card-head"><h3 class="card-title">📧 جیمیل‌های متصل ثبت ویزا (${state.gmails.length})</h3>
          <button class="btn btn-gmail btn-sm" onclick="saveDailyToCompanyGmail()">ذخیره روزانه در جیمیل شرکت</button></div>
          <div class="table-wrap"><table><thead><tr><th>جیمیل</th><th>کشور</th><th>یادداشت</th><th>باز کردن</th></tr></thead><tbody>
            ${state.gmails.length ? state.gmails.map(g => `<tr>
              <td dir="ltr" style="text-align:right;"><strong>${esc(g.email)}</strong></td><td>${esc(g.country)}</td><td>${esc(g.lastFeed||"—")}</td>
              <td><a class="btn btn-gmail btn-sm" target="_blank" rel="noopener" href="https://mail.google.com/mail/?authuser=${encodeURIComponent(g.email)}">باز کردن جیمیل</a></td>
            </tr>`).join("") : `<tr><td colspan="4" style="text-align:center;color:var(--muted);">جیمیلی ثبت نشده است.</td></tr>`}
          </tbody></table></div>
        </div>
      `;
    }

    function docsView() {
      return `
        <div class="card">
          <div class="card-head">
            <h3 class="card-title">📁 نگهداری اسناد، درایو E و پوشه شخصی</h3>
            <div class="actions">
              <button class="btn btn-teal btn-sm" onclick="connectEDriveFolder()">💾 اتصال پوشه درایو E</button>
              <button class="btn btn-primary btn-sm" onclick="importFilesFromComputerFolderForCurrentForm()">📥 فراخوانی از پوشه کامپیوتر</button>
            </div>
          </div>
          <form class="grid-form" onsubmit="addDoc(event)">
            <div class="field"><label>نام پوشه / مشتری</label><input name="ownerName" placeholder="نام فرد برای پوشه شخصی" /></div>
            <div class="field"><label>عنوان سند *</label><input name="title" required /></div>
            <div class="field"><label>فایل / تصویر *</label><input type="file" id="docInp" required /></div>
            <div class="field"><button type="submit" class="btn btn-primary">ذخیره سند</button></div>
          </form>
        </div>
        <div class="card"><div class="table-wrap"><table><thead><tr><th>عنوان</th><th>نام فایل</th><th>ثبت‌کننده</th><th>دانلود</th></tr></thead><tbody>
          ${state.docs.length ? state.docs.map(d => `<tr><td><strong>${esc(d.title)}</strong></td><td>${esc(d.name)}</td><td>${esc(d.createdBy||"—")}</td><td><a class="btn btn-success btn-sm" href="${d.data}" download="${esc(d.name)}">دانلود</a></td></tr>`).join("") : `<tr><td colspan="4" style="text-align:center;color:var(--muted);">سندی نیست.</td></tr>`}
        </tbody></table></div></div>
      `;
    }
    function addDoc(e) {
      e.preventDefault(); if (!checkWorkAllowed()) return;
      const f = document.getElementById("docInp").files[0]; if (!f) return;
      const fd = new FormData(e.target);
      const ownerName = (fd.get("ownerName") || "").trim();
      const title = (fd.get("title") || "").trim();
      const r = new FileReader();
      r.onload = async ev => {
        const folder = ownerName ? personFolderName({ firstName: ownerName, lastName: "" }) : "";
        const fileName = folder ? `${folder}_${f.name}` : f.name;
        if (folder) await writeFileIntoPersonalFolder(folder, fileName, ev.target.result, true);
        state.docs.unshift({ id: "DOC-" + Date.now(), title, name: fileName, data: ev.target.result, date: todayISO(), createdBy: me().name });
        saveState(); render(); notify("سند ذخیره شد.");
      };
      r.readAsDataURL(f);
    }

    function auditView() {
      return `
        <div class="card"><div class="card-head"><h3 class="card-title">🕵️ تاریخچه ثبت و فعالیت کارمندان</h3></div>
        <div class="table-wrap"><table><thead><tr><th>زمان</th><th>کارمند</th><th>شرح فعالیت</th></tr></thead><tbody>
          ${state.auditLogs.length ? state.auditLogs.map(l => `<tr><td dir="ltr" style="text-align:right;">${esc(l.time)}</td><td><strong>${esc(l.user)}</strong></td><td>${esc(l.action)}</td></tr>`).join("") : `<tr><td colspan="3" style="text-align:center;color:var(--muted);">موردی ثبت نشده است.</td></tr>`}
        </tbody></table></div></div>
      `;
    }

    function officeView() {
      const ok = state.presidentApproved && state.viceApproved;
      return `
        <div class="card">
          <div class="card-head"><h3 class="card-title">🔐 تنظیمات لوگو، جیمیل روزانه، سرور و رمزها</h3></div>
          <div class="alert-box">
            <div>تغییر رمز مالی و رمز این بخش فقط با تایید همزمان <strong>رئیس</strong> و <strong>معاون</strong> فعال می‌شود.</div>
            <div class="actions">
              <button type="button" class="btn ${state.presidentApproved?"btn-success":"btn-outline"} btn-sm" onclick="state.presidentApproved=!state.presidentApproved;saveState();render()">${state.presidentApproved?"✓ تایید رئیس":"تایید رئیس"}</button>
              <button type="button" class="btn ${state.viceApproved?"btn-success":"btn-outline"} btn-sm" onclick="state.viceApproved=!state.viceApproved;saveState();render()">${state.viceApproved?"✓ تایید معاون":"تایید معاون"}</button>
            </div>
          </div>
          <form class="grid-form" onsubmit="saveOffice(event)">
            <div class="field"><label>نام شرکت *</label><input id="oName" required value="${esc(state.office.name)}" /></div>
            <div class="field"><label>جیمیل مخصوص شرکت (ذخیره روزانه)</label><input type="email" id="oGmail" value="${esc(state.companyBackupGmail)}" placeholder="company@gmail.com" /></div>
            <div class="field"><label>آدرس همگام‌سازی سرور (اختیاری)</label><input id="oServerUrl" value="${esc(state.serverSyncUrl)}" placeholder="https://your-domain.com/server_sync.php" /></div>
            <div class="field"><label>مسیر پوشه درایو E</label><input id="oDrive" value="${esc(state.eDriveFolderLabel || "E:\\Kandahar_Travel_Clients")}" /></div>
            <div class="field"><label>رمز بخش مالی (${ok?"قابل تغییر":"قفل"})</label><input id="oFinP" value="${esc(state.financePassword)}" ${ok?"":"readonly"} /></div>
            <div class="field"><label>رمز این بخش (${ok?"قابل تغییر":"قفل"})</label><input id="oSetP" value="${esc(state.settingsPassword)}" ${ok?"":"readonly"} /></div>
            <div class="field"><label>آپلود لوگوی جدید</label><input type="file" accept="image/*" onchange="pickLogoImage(event)" /><input type="hidden" id="oLogoH" value="${esc(state.office.logo)}" /></div>
            <div class="field"><button type="submit" class="btn btn-primary">ذخیره تنظیمات</button></div>
          </form>
        </div>
      `;
    }

    function saveOffice(e) {
      e.preventDefault();
      state.office.name = document.getElementById("oName").value.trim();
      state.companyBackupGmail = document.getElementById("oGmail").value.trim();
      state.serverSyncUrl = document.getElementById("oServerUrl").value.trim();
      state.eDriveFolderLabel = document.getElementById("oDrive").value.trim() || "E:\\Kandahar_Travel_Clients";
      if (state.presidentApproved && state.viceApproved) {
        state.financePassword = document.getElementById("oFinP").value.trim();
        state.settingsPassword = document.getElementById("oSetP").value.trim();
        state.presidentApproved = false; state.viceApproved = false;
        notify("رمزها و تنظیمات با تایید رئیس و معاون ذخیره شدند.");
      } else {
        notify("تنظیمات شرکت، سرور و جیمیل ذخیره شد.");
      }
      saveState(); render();
    }

    function expView() {
      return `
        <div class="card"><div class="card-head"><h3 class="card-title">💸 ثبت هزینه‌های دفتر</h3></div>
        <form class="grid-form" onsubmit="e=>{e.preventDefault();}">
          <div class="field"><label>عنوان هزینه *</label><input id="exT" required /></div>
          <div class="field"><label>ارز</label><select id="exC">${currOpts("AFN")}</select></div>
          <div class="field"><label>مبلغ *</label><input type="number" id="exA" step="0.01" required /></div>
          <div class="field"><button type="button" class="btn btn-primary" onclick="if(!checkWorkAllowed())return;const t=document.getElementById('exT').value.trim();const a=+document.getElementById('exA').value;if(t&&a>0){state.expenses.unshift({title:t,currency:document.getElementById('exC').value,amount:a,date:todayISO(),createdBy:me().name});saveState();render();notify('هزینه ثبت شد.');}">ثبت هزینه</button></div>
        </form></div>
        <div class="card"><div class="table-wrap"><table><thead><tr><th>عنوان</th><th>مبلغ</th><th>تاریخ</th><th>ثبت‌کننده</th></tr></thead><tbody>
          ${state.expenses.map(x => `<tr><td>${esc(x.title)}</td><td>${currSym(x.currency)}${fmt(x.amount)}</td><td>${esc(x.date)}</td><td>${esc(x.createdBy||"—")}</td></tr>`).join("")}
        </tbody></table></div></div>
      `;
    }

    function repView() {
      const lines = Object.values(CURRENCIES).map(c => {
        const inc = state.visas.filter(v => (v.currency||"AFN")===c.code).reduce((s,v)=>s+Number(v.paid||0),0);
        const exp = state.expenses.filter(x => x.currency===c.code).reduce((s,x)=>s+Number(x.amount||0),0);
        return `<li><strong>${c.label}:</strong> دریافتی ویزا ${c.symbol}${fmt(inc)} | هزینه‌ها ${c.symbol}${fmt(exp)}</li>`;
      }).join("");
      return `<div class="card"><div class="card-head"><h3 class="card-title">📈 گزارش مالی جامع به تفکیک ۴ اسعار</h3></div><ul style="padding-right:18px;line-height:2;">${lines}</ul></div>`;
    }

    function saveDailyToCompanyGmail() {
      state.lastDailyGmailSave = todayISO();
      addAudit(`ثبت/ارسال بکاپ روزانه به جیمیل شرکت (${state.companyBackupGmail || "تنظیم نشده"})`);
      saveState();
      downloadBackup();
      if (state.companyBackupGmail) {
        window.open(`https://mail.google.com/mail/?authuser=${encodeURIComponent(state.companyBackupGmail)}&view=cm&fs=1&to=${encodeURIComponent(state.companyBackupGmail)}&su=${encodeURIComponent("بکاپ روزانه " + state.office.name + " - " + todayISO())}`, "_blank");
      } else {
        notify("فایل بکاپ دانلود شد؛ در بخش تنظیمات، جیمیل مخصوص شرکت را وارد کنید.");
      }
    }

    function downloadBackup() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `Kandahar_Travel_Backup_${todayISO()}.json`; a.click();
    }

    function restoreBackup(ev) {
      const f = ev.target.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = e => {
        try {
          const p = JSON.parse(e.target.result);
          state = Object.assign(emptyData(), p, { unlocked: true });
          saveState(); render(); notify("بکاپ بازیابی شد.");
        } catch (err) { notify("فایل بکاپ نامعتبر است.", true); }
      };
      r.readAsText(f);
    }

    function closeModal() { document.getElementById("modalBg").classList.remove("open"); }
    handleQrHash();
    render();
  </script>
</body>
</html>
